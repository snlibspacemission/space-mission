<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>QR 인쇄 (직원용)</title>
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
  <style>
    :root { --ink: #1b2340; --soft: #5b6385; --line: #d7dbea; --gold: #f2b530; --navy: #0b1026; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Gowun Dodum", "Apple SD Gothic Neo", sans-serif; color: var(--ink); background: #f4f5fa; }
    .wrap { max-width: 980px; margin: 0 auto; padding: 24px 16px; }
    h1 { font-family: "Jua", sans-serif; font-weight: 400; margin: 0 0 6px; }
    .panel { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin: 16px 0; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    input { flex: 1 1 320px; min-height: 44px; padding: 8px 12px; font-size: 16px; border: 1px solid var(--line); border-radius: 10px; }
    button { min-height: 44px; padding: 8px 16px; font-size: 16px; border-radius: 10px; border: 0; cursor: pointer; background: var(--navy); color: #fff; font-family: inherit; }
    button.alt { background: #fff; color: var(--ink); border: 1px solid var(--line); }
    .note { color: var(--soft); font-size: 14px; margin: 8px 0 0; }
    .warn { color: #b3261e; }
    .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
    .mbtn { display: inline-flex; align-items: center; justify-content: center; min-width: 56px; min-height: 40px; border-radius: 10px; border: 1px solid var(--line); text-decoration: none; color: var(--ink); background: #fff; font-family: "Jua", sans-serif; }
    .mbtn:hover { border-color: var(--navy); }
    .sheet { display: contents; }
    body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .qcard {
      background: #fff; border: 3px solid var(--navy); border-radius: 18px; padding: 16px;
      text-align: center; break-inside: avoid; page-break-inside: avoid;
    }
    .qcard .top { display: flex; align-items: center; justify-content: center; gap: 8px; font-family: "Jua", sans-serif; font-size: 22px; }
    .qcard.desk { border-color: var(--gold); border-width: 4px; background: #fffaf0; }
    .qcard.desk .num { background: none; color: var(--navy); border: 2px solid var(--navy); }
    .qcard .sub { font-size: 13px; color: var(--soft); margin-top: 2px; }
    .links { list-style: none; }
    .links b { font-family: "Jua", sans-serif; font-weight: 400; color: var(--navy); }
    .qcard .num { background: var(--gold); color: var(--navy); border-radius: 999px; padding: 2px 12px; }
    .qcard .icon { font-size: 30px; }
    .qcard .ttl { font-family: "Jua", sans-serif; font-size: 18px; margin: 6px 0 10px; min-height: 2.6em; }
    .qcard .qr svg { width: 200px; height: 200px; display: block; margin: 0 auto; }
    .qcard .cta { font-family: "Jua", sans-serif; font-size: 17px; margin-top: 8px; }
    .links { margin: 10px 0 0; padding-left: 0; font-size: 14px; display: grid; gap: 6px; }
    .links a { color: var(--soft); word-break: break-all; font-size: 12px; }
    @media print {
      body { background: #fff; }
      .no-print { display: none !important; }
      .wrap { padding: 0; max-width: none; }
      .cards { display: block; }
      /* 종이 한 장 = 카드 4장. 종이마다 안쪽 여백 12mm를 두어 2·3쪽도 잘리지 않아요. */
      .sheet { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10mm; align-content: start;
               height: 297mm; padding: 12mm; break-after: page; page-break-after: always; }
      .sheet:last-child { break-after: auto; page-break-after: auto; }
      .qcard { height: 125mm; display: flex; flex-direction: column; justify-content: center; }
      .qcard .qr svg { width: 62mm; height: 62mm; }
      /* 여백을 0으로 두면 브라우저가 위아래에 페이지 주소·날짜를 넣지 않아요. */
      @page { size: A4; margin: 0; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="no-print">
      <h1>QR 코드 인쇄 (직원용) · 안내데스크 1 + 정거장 9</h1>
      <p class="note">아래 주소는 지금 열린 사이트 주소로 자동 채워져요. GitHub Pages에 올린 뒤 이 페이지를 열면 그대로 인쇄하면 됩니다.</p>
      <div class="panel">
        <div class="row">
          <input id="base" type="text" aria-label="사이트 주소">
          <button id="apply">QR 다시 만들기</button>
          <button class="alt" onclick="window.print()">🖨 인쇄</button>
        </div>
        <p class="note" id="base-warn"></p>
      </div>
      <div class="panel">
        <b>정거장 주소 확인 · 테스트</b>
        <p class="note">이 목록은 화면에만 보이고 인쇄되지 않아요.</p>
        <ul id="links" class="links"></ul>
      </div>
      <div class="panel">
        <b>월별 문제 미리보기</b>
        <p class="note">누르면 그 달 문제로 미션이 열려요. 기록은 실제 운영과 따로 저장되고, 화면 위 '미리보기 끝내기'를 누르면 원래대로 돌아가요.</p>
        <div class="row" id="months" style="margin-top:10px"></div>
      </div>
    </div>
    <div class="cards" id="cards"></div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/vendor/qrcode.js"></script>
  <script>
    (function () {
      var M = window.MISSION_CONFIG;
      var input = document.getElementById("base");
      var warn = document.getElementById("base-warn");

      function defaultBase() {
        var p = location.href.split("?")[0].split("#")[0];
        return p.replace(/qr\.html$/, "");
      }
      function esc(t) { return String(t).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }

      function render() {
        var base = input.value.trim();
        if (base && !/\/$/.test(base)) base += "/";
        warn.textContent = /^https:\/\//.test(base) ? "" :
          "⚠ 지금은 인터넷 주소(https://)가 아니에요. GitHub Pages 주소로 바꾼 뒤 인쇄해야 휴대폰에서 열립니다.";
        warn.className = "note" + (warn.textContent ? " warn" : "");

        // 안내데스크 QR(출발용)을 맨 앞에, 그다음 전시실 정거장 9곳
        var D = M.desk;
        var items = [{ code: D.code, icon: D.icon, badge: D.label, title: D.title, cta: "📱 찍고 대원 등록하기", desk: true }]
          .concat(M.stations.map(function (s, i) {
            return { code: s.code, icon: s.icon, badge: "정거장 " + (i + 1), title: s.exhibit, cta: "📱 찍고 미션 시작!" };
          }));

        document.getElementById("links").innerHTML = items.map(function (it) {
          var url = base + "?s=" + encodeURIComponent(it.code);
          return '<li><b>' + esc(it.badge) + '</b> ' + it.icon + ' ' + esc(it.title) + '<br><a href="' + esc(url) + '" target="_blank">' + esc(url) + '</a></li>';
        }).join("");

        var cardHtml = items.map(function (it) {
          var url = base + "?s=" + encodeURIComponent(it.code);
          var qr = qrcode(0, "M");
          qr.addData(url);
          qr.make();
          return '<div class="qcard' + (it.desk ? ' desk' : '') + '">' +
            '<div class="top"><span class="num">' + esc(it.badge) + '</span><span class="icon">' + it.icon + '</span></div>' +
            '<div class="ttl">' + esc(it.title) + '</div>' +
            '<div class="qr">' + qr.createSvgTag({ cellSize: 6, margin: 2, scalable: true }) + '</div>' +
            '<div class="cta">' + it.cta + '</div>' +
            (it.desk ? '<div class="sub">별명을 정한 뒤 전시실로 들어가요</div>' : '') +
          '</div>';
        });
        var sheets = "";
        for (var k = 0; k < cardHtml.length; k += 4) sheets += '<div class="sheet">' + cardHtml.slice(k, k + 4).join("") + '</div>';
        document.getElementById("cards").innerHTML = sheets;
      }

      var mb = "";
      for (var m = 1; m <= 12; m++) mb += '<a class="mbtn" target="_blank" href="index.html?set=' + m + '">' + m + "월</a>";
      document.getElementById("months").innerHTML = mb;
      input.value = defaultBase();
      document.getElementById("apply").addEventListener("click", render);
      input.addEventListener("keydown", function (e) { if (e.key === "Enter") render(); });
      render();
    })();
  </script>
</body>
</html>
